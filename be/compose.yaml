name: nihongo-master
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nihongo
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: nihongo_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nihongo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihongo -d nihongo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nihongo-db:

